{% extends "blog/base.html" %}
{% block title %}حذف نوشته{% endblock %}
{% block content %}
<section class="form-panel">
    <h1>حذف نوشته</h1>
    <p>آیا از حذف «{{ post.title }}» مطمئن هستید؟</p>
    <form method="post">
        {% csrf_token %}
        <button class="danger-button">حذف</button>
        <a href="{% url 'dashboard' %}">انصراف</a>
    </form>
</section>
{% endblock %}
