{% extends "blog/base.html" %}
{% block title %}ورود{% endblock %}
{% block content %}
<section class="form-panel auth-panel">
    <span class="eyebrow">خوش برگشتی</span>
    <h1>ورود به حساب</h1>
    <form method="post" class="django-form">
        {% csrf_token %}
        
        {{ form.as_p }}
        
        <input type="hidden" name="next" value="{{ next }}">
        <button class="primary-button">ورود</button>
    </form>
    <p>حساب ندارید؟ <a href="{% url 'register' %}">عضویت</a></p>
</section>

{% endblock %}
